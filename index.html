<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>عيادة كريستال السنية التجميلية</title>
    
    <link rel="icon" type="image/png" href="./krestali.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="manifest" href="./manifest.json">

    <style>
        /* نفس الـ CSS السابق بالكامل */
        :root {
            --bg-primary: #fdf2f8;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.3);
            --bg-glass-hover: rgba(255, 255, 255, 0.5);
            --text-primary: #1a0e1a;
            --text-secondary: #6b4c6a;
            --text-muted: #a07c9e;
            --accent: #e84393;
            --accent-light: #fd79a8;
            --accent-dark: #c2186b;
            --border-glass: rgba(232, 67, 147, 0.15);
            --shadow-glass: 0 8px 32px rgba(232, 67, 147, 0.1);
            --gradient-header: linear-gradient(135deg, #f8bbd0, #fce4ec);
            --blur-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        [data-theme="night"] {
            --bg-primary: #0d0a0d;
            --bg-secondary: #1a0e1a;
            --bg-glass: rgba(45, 27, 46, 0.4);
            --bg-glass-hover: rgba(45, 27, 46, 0.6);
            --text-primary: #f5e6f0;
            --text-secondary: #c9a8c5;
            --text-muted: #8a6f88;
            --accent: #b33771;
            --accent-light: #d65a96;
            --accent-dark: #8a2a5a;
            --border-glass: rgba(179, 55, 113, 0.2);
            --shadow-glass: 0 8px 32px rgba(179, 55, 113, 0.15);
            --gradient-header: linear-gradient(135deg, #2d1b2e, #1a0e1a);
            --blur-bg: rgba(26, 14, 26, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.5s ease;
            overflow-x: hidden;
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass:hover {
            transform: translateY(-2px);
            background: var(--bg-glass-hover);
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 100px;
            position: relative;
            min-height: 100vh;
        }

        .header-section {
            text-align: center;
            padding: 30px 20px 24px;
            background: var(--gradient-header);
            border-radius: 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            animation: slideDown 0.6s ease;
        }
        .header-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 0;
        }
        .header-section>* { position: relative; z-index: 1; }
        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(232, 67, 147, 0.15);
            transition: all 0.4s ease;
            animation: float 3s ease-in-out infinite;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .header-title { font-size: 24px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px; }
        .header-sub { font-size: 14px; color: var(--text-secondary); margin-top: 4px; font-weight: 300; }

        .day-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            animation: slideDown 0.7s ease;
        }
        .day-btn {
            flex: 1;
            padding: 16px 8px;
            border: none;
            border-radius: 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            text-align: center;
            box-shadow: var(--shadow-glass);
            position: relative;
            overflow: hidden;
        }
        .day-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent);
            opacity: 0;
            transition: all 0.4s ease;
            border-radius: 20px;
        }
        .day-btn .day-name {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }
        .day-btn .day-date {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            position: relative;
            z-index: 1;
        }
        .day-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 24px rgba(232, 67, 147, 0.35);
            transform: scale(1.02);
        }
        .day-btn.active .day-name { color: white; }
        .day-btn.active .day-date { color: rgba(255, 255, 255, 0.8); }
        .day-btn:hover:not(.active) { transform: translateY(-3px); background: var(--bg-glass-hover); }

        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            min-height: 200px;
            animation: slideDown 0.8s ease;
        }
        .slot-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: var(--shadow-glass);
            animation: fadeInUp 0.5s ease backwards;
        }
        .slot-item:nth-child(1) { animation-delay: 0.05s; }
        .slot-item:nth-child(2) { animation-delay: 0.10s; }
        .slot-item:nth-child(3) { animation-delay: 0.15s; }
        .slot-item:nth-child(4) { animation-delay: 0.20s; }
        .slot-item:nth-child(5) { animation-delay: 0.25s; }
        .slot-item:nth-child(6) { animation-delay: 0.30s; }
        .slot-item:nth-child(7) { animation-delay: 0.35s; }
        .slot-item:nth-child(8) { animation-delay: 0.40s; }
        .slot-item:nth-child(9) { animation-delay: 0.45s; }
        .slot-item:nth-child(10) { animation-delay: 0.50s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slot-item:hover:not(.booked) { transform: translateX(-6px) scale(1.01); background: var(--bg-glass-hover); }
        .slot-item.booked { opacity: 0.5; cursor: not-allowed; }
        .slot-item .slot-time { font-size: 20px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
        .slot-item .slot-status {
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .slot-item .slot-status.available {
            color: var(--accent);
            border: 1px solid var(--accent);
            animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(232, 67, 147, 0.1); } 50% { box-shadow: 0 0 40px rgba(232, 67, 147, 0.2); } }
        .slot-item .slot-status.booked { color: var(--text-muted); border: 1px solid var(--text-muted); }
        .slot-loading { text-align: center; padding: 50px 0; color: var(--text-muted); }
        .slot-loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-glass);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); align-items: center; justify-content: center; z-index: 1000; padding: 20px; animation: fadeIn 0.4s ease; }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .modal-content { background: var(--bg-glass); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 36px 28px; max-width: 400px; width: 100%; box-shadow: 0 32px 80px rgba(0,0,0,0.2); animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.8) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-content .modal-title { font-size: 26px; font-weight: 700; color: var(--text-primary); text-align: center; margin-bottom: 4px; }
        .modal-content .modal-sub { text-align: center; color: var(--text-secondary); font-size: 15px; margin-bottom: 24px; }
        .modal-content .form-group { margin-bottom: 16px; }
        .modal-content .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .modal-content .form-group input { width: 100%; padding: 14px 18px; border: none; border-radius: 16px; background: var(--blur-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--border-glass); font-size: 15px; color: var(--text-primary); transition: all 0.3s ease; font-family: inherit; }
        .modal-content .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(232, 67, 147, 0.12); }
        .modal-content .form-group input::placeholder { color: var(--text-muted); }
        .modal-content .form-group input.error { border-color: #e74c3c; box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.12); }
        .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
        .modal-actions .btn { flex: 1; padding: 14px; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .btn-cancel { background: var(--bg-glass); color: var(--text-secondary); border: 1px solid var(--border-glass); }
        .btn-cancel:hover { background: var(--bg-glass-hover); transform: scale(1.02); }
        .btn-confirm { background: var(--accent); color: white; border: 1px solid var(--accent); box-shadow: 0 4px 20px rgba(232, 67, 147, 0.3); }
        .btn-confirm:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 32px rgba(232, 67, 147, 0.4); }

        .appointment-screen { display: none; flex-direction: column; position: fixed; inset: 0; background: var(--bg-primary); z-index: 100; padding: 20px; animation: fadeIn 0.6s ease; overflow-y: auto; }
        .appointment-screen.active { display: flex; }

        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 420px; pointer-events: none; }
        .toast { padding: 18px 28px; border-radius: 20px; background: var(--bg-glass); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px); border: 1px solid var(--glass-border); box-shadow: 0 16px 60px rgba(0,0,0,0.15); text-align: center; font-weight: 600; font-size: 15px; color: var(--text-primary); margin-bottom: 10px; animation: toastSlide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: auto; }
        @keyframes toastSlide { from { opacity: 0; transform: translateY(-40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .toast.success { border-color: #2ecc71; }
        .toast.error { border-color: #e74c3c; }
        .toast.info { border-color: var(--accent); }
        .toast.warning { border-color: #f39c12; }

        .bottom-nav { position: fixed; bottom: 20px; left: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 500; animation: slideUp 0.6s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border-glass); background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--text-muted); font-size: 18px; cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-glass); position: relative; }
        .nav-btn:hover { transform: scale(1.12); color: var(--accent); background: var(--bg-glass-hover); }
        .nav-btn.active { color: var(--accent); background: var(--bg-glass-hover); box-shadow: 0 0 30px rgba(232, 67, 147, 0.15); }
        .nav-btn .badge-dot { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; background: #2ecc71; border-radius: 50%; border: 2px solid var(--bg-secondary); display: none; }
        .nav-btn .badge-dot.show { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .nav-btn .tooltip { position: absolute; right: 56px; background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass); padding: 4px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; opacity: 0; pointer-events: none; transition: all 0.3s ease; }
        .nav-btn:hover .tooltip { opacity: 1; transform: translateX(-4px); }

        .confirm-dialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); align-items: center; justify-content: center; z-index: 3000; padding: 20px; animation: fadeIn 0.3s ease; }
        .confirm-dialog.active { display: flex; }
        .confirm-dialog .dialog-box { background: var(--bg-glass); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 32px 28px; max-width: 380px; width: 100%; text-align: center; animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .confirm-dialog .dialog-icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .confirm-dialog .dialog-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .confirm-dialog .dialog-message { font-size: 15px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6; }
        .confirm-dialog .dialog-actions { display: flex; gap: 12px; }
        .confirm-dialog .dialog-actions .btn { flex: 1; padding: 14px; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .confirm-dialog .dialog-actions .btn-dialog-cancel { background: var(--bg-glass); color: var(--text-secondary); border: 1px solid var(--border-glass); }
        .confirm-dialog .dialog-actions .btn-dialog-cancel:hover { background: var(--bg-glass-hover); }
        .confirm-dialog .dialog-actions .btn-dialog-confirm { background: #e74c3c; color: white; border: 1px solid #e74c3c; }
        .confirm-dialog .dialog-actions .btn-dialog-confirm:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(231, 76, 60, 0.3); }

        .appointment-bg-overlay { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .appointment-bg-image { position: absolute; inset: -20px; background: url('./pack.png') center center / cover no-repeat; filter: blur(2px) brightness(0.6); transform: scale(1.05); transition: filter 0.5s ease; }
        .appointment-bg-overlay::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
        .appointment-content { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; padding: 20px 20px 30px; min-height: 100vh; justify-content: center; }
        .appointment-header-full { text-align: center; padding: 20px 20px 24px; margin-top: 10px; }
        .icon-wrapper { position: relative; display: inline-block; width: 80px; height: 80px; margin-bottom: 16px; }
        .icon-wrapper .icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; z-index: 2; animation: float 3s ease-in-out infinite; }
        .icon-ring { position: absolute; inset: -4px; border-radius: 50%; border: 3px solid rgba(46, 204, 113, 0.3); animation: ringPulse 2s ease-in-out infinite; }
        .icon-ring::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; border: 2px solid rgba(46, 204, 113, 0.15); animation: ringPulse 2s ease-in-out infinite 0.5s; }
        @keyframes ringPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.4; } }
        .appointment-header-full .title { font-size: 28px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4); letter-spacing: 1px; }
        .appointment-header-full .sub { font-size: 16px; color: rgba(255, 255, 255, 0.8); margin-top: 4px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3); }
        .counter-box-full { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; max-width: 440px; margin: 0 auto; width: 100%; }
        .counter-display-full { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px 24px; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2); }
        .counter-display-full .counter-icon { font-size: 32px; opacity: 0.8; }
        .counter-display-full .counter-time { font-size: 48px; font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 4px; color: #ffffff; text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3); font-variant-numeric: tabular-nums; transition: color 0.5s ease; }
        .counter-display-full.urgent .counter-time { color: #ff6b6b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .progress-container-full { width: 100%; position: relative; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); padding: 4px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        .progress-fill-full { height: 12px; background: linear-gradient(90deg, #2ecc71, #27ae60); border-radius: 16px; transition: width 1s linear; width: 100%; position: relative; }
        .progress-fill-full::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent); animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .progress-fill-full.urgent { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }
        .progress-label { display: flex; justify-content: space-between; margin-top: 6px; padding: 0 4px; font-size: 12px; color: rgba(255, 255, 255, 0.6); font-weight: 500; }
        .counter-details-full { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .counter-detail-full { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 18px; padding: 16px 14px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: center; transition: all 0.3s ease; }
        .counter-detail-full:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.15); }
        .counter-detail-full .label { font-size: 11px; color: rgba(255, 255, 255, 0.5); font-weight: 500; display: block; letter-spacing: 0.5px; }
        .counter-detail-full .value { font-size: 16px; font-weight: 600; color: #ffffff; display: block; margin-top: 4px; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.2); }
        .btn-cancel-full { position: relative; overflow: hidden; padding: 18px 28px; border: none; border-radius: 20px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 107, 107, 0.3); color: #ff6b6b; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); margin-top: 10px; }
        .btn-cancel-full .btn-icon { display: inline-flex; align-items: center; justify-content: center; font-size: 18px; transition: transform 0.4s ease; }
        .btn-cancel-full .btn-text { position: relative; z-index: 2; }
        .btn-cancel-full .btn-ripple { position: absolute; inset: 0; border-radius: 20px; background: rgba(255, 107, 107, 0.1); transform: scale(0); opacity: 0; transition: all 0.6s ease; z-index: 0; }
        .btn-cancel-full:hover { transform: translateY(-3px) scale(1.02); background: rgba(255, 107, 107, 0.15); border-color: rgba(255, 107, 107, 0.6); box-shadow: 0 8px 35px rgba(255, 107, 107, 0.25); color: #ff6b6b; }
        .btn-cancel-full:hover .btn-icon { transform: rotate(15deg) scale(1.1); }
        .btn-cancel-full:hover .btn-ripple { transform: scale(1.5); opacity: 1; }
        .btn-cancel-full:active { transform: scale(0.95) !important; transition-duration: 0.1s; }

        @keyframes borderPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.04); opacity: 1; } }

        @media (max-width: 480px) {

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

   <script>
    // ============================================================
    // CONFIGURATION - Supabase + Telegram
    // ============================================================
// في ملف index.html
let SUPABASE_URL = '';
let SUPABASE_ANON_KEY = '';
let BOT_TOKEN = '';
let CHANNEL_ID = '';
let TG_API = '';

async function loadConfig() {
    try {
        const response = await fetch('/api/config');
        if (!response.ok) throw new Error('Failed to fetch config');
        const config = await response.json();
        
        SUPABASE_URL = config.SUPABASE_URL;
        SUPABASE_ANON_KEY = config.SUPABASE_ANON_KEY;
        BOT_TOKEN = config.BOT_TOKEN;
        CHANNEL_ID = config.CHANNEL_ID;
        TG_API = `https://api.telegram.org/bot${BOT_TOKEN}`;
        
        console.log('✅ تم تحميل الإعدادات من API');
        return true;
    } catch (error) {
        console.error('❌ فشل تحميل الإعدادات:', error);
        return false;
    }
}
    const WORK_START = 10;
    const WORK_END = 20;

    // تهيئة Supabase
    let supabaseClient;
    
    function initSupabase() {
        if (typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client initialized');
            return true;
        } else {
            console.error('❌ Supabase library not loaded');
            return false;
        }
    }

    // ============================================================
    // STATE
    // ============================================================
    const state = {
        selectedDay: 0,
        selectedDate: null,
        selectedTime: null,
        bookedSlots: {},
        allSlots: [],
        appointment: null,
        patientId: null,
        counterInterval: null,
        notificationSent30: false,
        notificationSentNow: false,
        isDark: false,
    };

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================
    function getToday() {
        return new Date().toISOString().split('T')[0];
    }

    function getDateFromDayOffset(offset) {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        return d.toISOString().split('T')[0];
    }

    function formatDateDisplay(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function formatDayName(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        const names = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        return names[d.getDay()];
    }

    function formatTime12(time24) {
        const [h] = time24.split(':').map(Number);
        const period = h >= 12 ? 'مساءً' : 'صباحاً';
        const h12 = h % 12 || 12;
        return `${h12} ${period}`;
    }

    function generatePatientId() {
        return 'P' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
    }

    function isValidWhatsapp(number) {
        const cleaned = number.replace(/\s/g, '');
        return /^(09\d{8}|(\+963)\d{9})$/.test(cleaned);
    }

    // ============================================================
    // SUPABASE FUNCTIONS
    // ============================================================
    async function fetchBookedSlots(date) {
        try {
            if (!supabaseClient) {
                throw new Error('Supabase not initialized');
            }
            
            const { data, error } = await supabaseClient
                .from('bookings')
                .select('*')
                .eq('date', date);

            if (error) {
                console.error('Supabase error:', error);
                throw error;
            }

            const booked = {};
            if (data) {
                data.forEach(booking => {
                    booked[booking.time.slice(0, 5)] = booking;
                });
            }
            console.log(`📅 الحجوزات لليوم ${date}:`, booked);
            return booked;
        } catch (error) {
            console.error('❌ خطأ في جلب الحجوزات:', error);
            showToast('فشل في تحميل الحجوزات', 'error');
            return {};
        }
    }

    async function addBooking(date, time, patientName, whatsapp) {
        try {
            if (!supabaseClient) {
                throw new Error('Supabase not initialized');
            }
            
            // التحقق من أن الموعد غير محجوز
            const existing = await fetchBookedSlots(date);
            if (existing[time]) {
                showToast('هذا الموعد محجوز بالفعل!', 'error');
                return { success: false, error: 'Slot already booked' };
            }

            // إضافة الحجز في Supabase
            const { data, error } = await supabaseClient
                .from('bookings')
                .insert([{
                    date: date,
                    time: time + ':00',
                    patient_name: patientName,
                    whatsapp: whatsapp,
                    message_id: null
                }])
                .select()
                .single();

            if (error) {
                console.error('Insert error:', error);
                throw error;
            }

            console.log('✅ تم إضافة الحجز:', data);

            // إرسال إشعار Telegram
            const notificationResult = await sendTelegramNotification(date, time, patientName, whatsapp);
            
            // تحديث message_id في قاعدة البيانات
            if (notificationResult.success && data) {
                await supabaseClient
                    .from('bookings')
                    .update({ message_id: notificationResult.message_id })
                    .eq('id', data.id);
            }

            return { success: true, messageId: notificationResult.message_id, bookingId: data.id };
        } catch (error) {
            console.error('❌ خطأ في إضافة الحجز:', error);
            showToast('فشل في إضافة الحجز', 'error');
            return { success: false, error: error.message };
        }
    }

    async function removeBooking(date, time) {
        try {
            if (!supabaseClient) {
                throw new Error('Supabase not initialized');
            }
            
            // جلب الحجز للحصول على message_id
            const { data: booking, error: fetchError } = await supabaseClient
                .from('bookings')
                .select('*')
                .eq('date', date)
                .eq('time', time + ':00')
                .single();

            if (fetchError) {
                console.error('Fetch booking error:', fetchError);
                throw fetchError;
            }

            // حذف رسالة Telegram إذا وجدت
            if (booking && booking.message_id) {
                await deleteTelegramMessage(booking.message_id);
            }

            // حذف الحجز من Supabase
            const { error: deleteError } = await supabaseClient
                .from('bookings')
                .delete()
                .eq('id', booking.id);

            if (deleteError) {
                console.error('Delete error:', deleteError);
                throw deleteError;
            }

            console.log('✅ تم حذف الحجز بنجاح');
            return true;
        } catch (error) {
            console.error('❌ خطأ في حذف الحجز:', error);
            showToast('فشل في حذف الحجز', 'error');
            return false;
        }
    }

    // ============================================================
    // TELEGRAM FUNCTIONS
    // ============================================================
    async function sendTelegramNotification(date, time, patientName, whatsapp) {
        const formattedTime = formatTime12(time);
        const dateDisplay = formatDateDisplay(date);
        
        const whatsappInternational = whatsapp.replace(/^0/, '963');
        
        const acceptMessage = `السلام عليكم\nكيف حالك يا ${patientName}\nتم تثبيت موعدك\nيوم ${dateDisplay}\nفي تمام الساعة ${formattedTime}\nنتمنى الالتزام`;

        const rejectMessage = `السلام عليكم\nكيف حالك يا ${patientName}\nنود اعلامك بأن الموعد الذي قمت بحجزه غير ملائم\nنتمنى أن تقوم بإلغاء الحجز وحجز موعد جديد`;
        
        const acceptUrl = `https://wa.me/${whatsappInternational}?text=${encodeURIComponent(acceptMessage)}`;
        const rejectUrl = `https://wa.me/${whatsappInternational}?text=${encodeURIComponent(rejectMessage)}`;

        const text = `✅ حجز جديد: ${date} | ${time} |\n-----------------------------\n📅 اليوم: ${dateDisplay}\n⏰ الوقت: ${formattedTime}\n-----------------------------\n👤 المريض: ${patientName}\n📱 واتساب: ${whatsapp}`;

        try {
            const response = await fetch(`${TG_API}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHANNEL_ID,
                    text: text,
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: '✅ قبول', url: acceptUrl },
                                { text: '❌ رفض', url: rejectUrl }
                            ]
                        ]
                    }
                })
            });
            
            const data = await response.json();
            if (data.ok) {
                console.log('✅ تم إرسال إشعار Telegram بنجاح');
                return { success: true, message_id: data.result.message_id };
            } else {
                console.error('❌ فشل إرسال إشعار Telegram:', data.description);
                return { success: false, error: data.description };
            }
        } catch (error) {
            console.error('❌ خطأ في إرسال إشعار Telegram:', error);
            return { success: false, error: error.message };
        }
    }

    async function deleteTelegramMessage(messageId) {
        try {
            const response = await fetch(`${TG_API}/deleteMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHANNEL_ID,
                    message_id: messageId
                })
            });
            
            const data = await response.json();
            
            if (data.ok) {
                console.log(`✅ تم حذف الرسالة ${messageId} بنجاح`);
                return true;
            } else {
                console.error(`❌ فشل حذف الرسالة ${messageId}:`, data.description);
                return false;
            }
        } catch (error) {
            console.error('❌ خطأ في حذف الرسالة:', error);
            return false;
        }
    }

    // ============================================================
    // TOAST NOTIFICATIONS
    // ============================================================
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-20px) scale(0.9)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }

    // ============================================================
    // CONFIRM DIALOG
    // ============================================================
    function showConfirmDialog(title, message, onConfirm) {
        const dialog = document.getElementById('confirmDialog');
        document.getElementById('dialogTitle').textContent = title;
        document.getElementById('dialogMessage').textContent = message;
        dialog.classList.add('active');

        const confirmBtn = document.getElementById('dialogConfirmBtn');
        const cancelBtn = document.getElementById('dialogCancelBtn');

        const cleanup = () => {
            dialog.classList.remove('active');
            confirmBtn.removeEventListener('click', handleConfirm);
            cancelBtn.removeEventListener('click', handleCancel);
        };

        const handleConfirm = () => {
            cleanup();
            onConfirm();
        };

        const handleCancel = () => {
            cleanup();
        };

        confirmBtn.addEventListener('click', handleConfirm);
        cancelBtn.addEventListener('click', handleCancel);

        dialog.addEventListener('click', function(e) {
            if (e.target === this) {
                cleanup();
            }
        });
    }

    // ============================================================
    // SLOTS DISPLAY
    // ============================================================
    async function loadSlotsForDay(dayOffset) {
        const date = getDateFromDayOffset(dayOffset);
        state.selectedDate = date;

        const container = document.getElementById('slotsContainer');
        container.innerHTML = `
            <div class="slot-loading">
                <div class="spinner"></div>
                <div>جاري تحميل المواعيد...</div>
            </div>
        `;

        try {
            const booked = await fetchBookedSlots(date);
            state.bookedSlots = booked;

            const allSlots = [];
            for (let h = WORK_START; h < WORK_END; h++) {
                const time = `${String(h).padStart(2, '0')}:00`;
                const isBooked = !!booked[time];
                allSlots.push({ time, isBooked });
            }
            state.allSlots = allSlots;

            if (allSlots.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:50px 0;color:var(--text-muted);">
                        <div style="font-size:16px;font-weight:600;">لا توجد مواعيد متاحة</div>
                        <div style="font-size:14px;margin-top:4px;">لهذا اليوم</div>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const slot of allSlots) {
                const statusClass = slot.isBooked ? 'booked' : 'available';
                const statusText = slot.isBooked ? 'محجوز' : 'متاح';
                const timeDisplay = formatTime12(slot.time);
                const clickAttr = slot.isBooked ? '' : ` onclick="openBookingModal('${slot.time}')"`;

                html += `
                    <div class="slot-item ${statusClass}" ${clickAttr}>
                        <span class="slot-time">${timeDisplay}</span>
                        <span class="slot-status ${statusClass}">${statusText}</span>
                    </div>
                `;
            }

            container.innerHTML = html;
            console.log('✅ تم تحميل المواعيد بنجاح');

        } catch (e) {
            console.error('Error loading slots:', e);
            container.innerHTML = `
                <div style="text-align:center;padding:50px 0;color:var(--text-muted);">
                    <div style="font-size:16px;font-weight:600;">حدث خطأ</div>
                    <div style="font-size:14px;margin-top:4px;">فشل تحميل المواعيد: ${e.message}</div>
                </div>
            `;
            showToast('فشل تحميل المواعيد، حاول مرة أخرى', 'error');
        }
    }

    // ============================================================
    // DAY SELECTOR
    // ============================================================
    function setupDaySelector() {
        const btns = document.querySelectorAll('.day-btn');

        for (let i = 0; i < 3; i++) {
            const date = getDateFromDayOffset(i + 1);
            const names = ['غداً', 'بعد غد', 'ما بعده'];
            document.getElementById(`dayName${i}`).textContent = names[i];
            document.getElementById(`dayDate${i}`).textContent = formatDayName(date) + ' ' + date.split('-').slice(1).join('/');
        }

        btns.forEach((btn, index) => {
            btn.addEventListener('click', function() {
                btns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                state.selectedDay = index;
                loadSlotsForDay(index + 1);
            });
        });

        btns[0].classList.add('active');
        loadSlotsForDay(1);
    }

    // ============================================================
    // BOOKING MODAL
    // ============================================================
    let selectedTimeForBooking = null;

    function openBookingModal(time) {
        if (!state.selectedDate) {
            showToast('الرجاء اختيار تاريخ أولاً', 'warning');
            return;
        }

        selectedTimeForBooking = time;
        document.getElementById('modalSub').textContent =
            `${formatDateDisplay(state.selectedDate)} - ${formatTime12(time)}`;
        document.getElementById('patientNameInput').value = '';
        document.getElementById('whatsappInput').value = '';
        document.getElementById('whatsappInput').classList.remove('error');
        document.getElementById('bookingModal').classList.add('active');
    }

    function closeBookingModal() {
        document.getElementById('bookingModal').classList.remove('active');
        selectedTimeForBooking = null;
    }

    async function confirmBooking() {
        const name = document.getElementById('patientNameInput').value.trim();
        const whatsapp = document.getElementById('whatsappInput').value.trim();
        const date = state.selectedDate;
        const time = selectedTimeForBooking;

        if (!name) {
            showToast('الرجاء إدخال اسمك', 'warning');
            return;
        }

        if (!isValidWhatsapp(whatsapp)) {
            document.getElementById('whatsappInput').classList.add('error');
            showToast('رقم واتساب غير صحيح. مثال: 0912345678', 'error');
            return;
        }
        document.getElementById('whatsappInput').classList.remove('error');

        // التحقق من أن الموعد ما زال متاحاً
        const currentBooked = await fetchBookedSlots(date);
        if (currentBooked[time]) {
            showToast('هذا الموعد تم حجزه حالياً', 'error');
            closeBookingModal();
            loadSlotsForDay(state.selectedDay + 1);
            return;
        }

        const patientId = state.patientId || generatePatientId();
        state.patientId = patientId;

        // إضافة الحجز
        const result = await addBooking(date, time, name, whatsapp);

        if (result.success) {
            const appointment = {
                date: date,
                time: time,
                patientName: name,
                patientId: patientId,
                whatsapp: whatsapp,
                messageId: result.messageId,
                bookingId: result.bookingId,
                bookingTimestamp: Date.now(),
                appointmentTimestamp: new Date(`${date}T${time}:00`).getTime()
            };

            localStorage.setItem('appointment', JSON.stringify(appointment));
            state.appointment = appointment;

            closeBookingModal();
            loadSlotsForDay(state.selectedDay + 1);
            showAppointmentScreen();
        } else {
            showToast(`فشل الحجز: ${result.error}`, 'error');
        }
    }

    // ============================================================
    // APPOINTMENT SCREEN
    // ============================================================
    function showAppointmentScreen() {
        document.getElementById('appointmentScreen').classList.add('active');

        const appt = state.appointment;
        if (!appt) {
            showToast('لا يوجد حجز نشط', 'warning');
            return;
        }

        document.getElementById('counterDate').textContent = formatDateDisplay(appt.date);
        document.getElementById('counterTime').textContent = formatTime12(appt.time);
        document.getElementById('counterPatient').textContent = appt.patientName;
        document.getElementById('counterWhatsapp').textContent = appt.whatsapp;

        startCounter(appt.appointmentTimestamp);
        document.getElementById('notificationDot').classList.add('show');
    }

    function hideAppointmentScreen() {
        if (state.counterInterval) {
            clearInterval(state.counterInterval);
            state.counterInterval = null;
        }
        document.getElementById('appointmentScreen').classList.remove('active');
        state.notificationSent30 = false;
        state.notificationSentNow = false;
        document.getElementById('notificationDot').classList.remove('show');
    }

    function startCounter(targetTimestamp) {
        if (state.counterInterval) {
            clearInterval(state.counterInterval);
        }

        function updateCounter() {
            const now = Date.now();
            let diff = targetTimestamp - now;

            if (diff <= 0) {
                document.getElementById('counterDisplay').textContent = '00:00:00';
                document.getElementById('counterDisplay').classList.add('urgent');
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressFill').classList.add('urgent');

                if (state.counterInterval) {
                    clearInterval(state.counterInterval);
                    state.counterInterval = null;
                }

                localStorage.removeItem('appointment');
                state.appointment = null;
                showToast('انتهى موعدك', 'info');

                setTimeout(() => {
                    hideAppointmentScreen();
                }, 2000);
                return;
            }

            const hours = Math.floor(diff / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);

            document.getElementById('counterDisplay').textContent =
                `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const totalDuration = 3600000;
            const progress = Math.max(0, (diff / totalDuration) * 100);
            document.getElementById('progressFill').style.width = `${Math.min(100, progress)}%`;

            if (diff < 600000) {
                document.getElementById('counterDisplay').classList.add('urgent');
                document.getElementById('progressFill').classList.add('urgent');
            } else {
                document.getElementById('counterDisplay').classList.remove('urgent');
                document.getElementById('progressFill').classList.remove('urgent');
            }

            checkNotifications(diff);
        }

        updateCounter();
        state.counterInterval = setInterval(updateCounter, 1000);
    }

    // ============================================================
    // NOTIFICATIONS
    // ============================================================
    function checkNotifications(diff) {
        if (diff > 0 && diff <= 3600000 && diff > 3500000 && !state.notificationSent30) {
            sendNotification('تذكير', 'موعدك بعد ساعة');
            state.notificationSent30 = true;
        }
        if (diff > 0 && diff <= 60000 && !state.notificationSentNow) {
            sendNotification('موعدك الآن', 'حان وقت موعدك في العيادة');
            state.notificationSentNow = true;
        }
    }

    function sendNotification(title, body) {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'granted') {
            new Notification(title, { body, icon: '🦷' });
        }
    }

    async function requestNotificationPermission() {
        if (!('Notification' in window)) {
            showToast('المتصفح لا يدعم الإشعارات', 'warning');
            return;
        }
        if (Notification.permission === 'granted') {
            showToast('الإشعارات مفعلة', 'success');
            return;
        }
        if (Notification.permission === 'denied') {
            showToast('الإشعارات ممنوعة، فعّلها من الإعدادات', 'warning');
            return;
        }
        const result = await Notification.requestPermission();
        if (result === 'granted') {
            showToast('تم تفعيل الإشعارات', 'success');
        } else {
            showToast('لم يتم تفعيل الإشعارات', 'warning');
        }
    }

    // ============================================================
    // CANCEL APPOINTMENT
    // ============================================================
    async function cancelAppointment() {
        const appt = state.appointment;
        if (!appt) {
            showToast('لا يوجد حجز نشط', 'warning');
            return;
        }

        showConfirmDialog(
            '🗑 إلغاء الموعد',
            `هل أنت متأكد من إلغاء حجز ${formatDateDisplay(appt.date)} الساعة ${formatTime12(appt.time)}؟`,
            async function() {
                const success = await removeBooking(appt.date, appt.time);
                
                if (success) {
                    localStorage.removeItem('appointment');
                    state.appointment = null;
                    showToast('تم إلغاء الحجز بنجاح', 'success');
                    hideAppointmentScreen();
                    loadSlotsForDay(state.selectedDay + 1);
                } else {
                    showToast('فشل إلغاء الحجز، حاول مرة أخرى', 'error');
                }
            }
        );
    }

    // ============================================================
    // THEME TOGGLE
    // ============================================================
    function toggleTheme() {
        state.isDark = !state.isDark;
        document.documentElement.setAttribute('data-theme', state.isDark ? 'night' : 'day');
        localStorage.setItem('theme', state.isDark ? 'night' : 'day');

        const icon = document.querySelector('#navTheme i');
        if (state.isDark) {
            icon.className = 'fas fa-sun';
            showToast('تم التبديل للثيم الليلي', 'info');
        } else {
            icon.className = 'fas fa-moon';
            showToast('تم التبديل للثيم النهاري', 'info');
        }
    }

    function loadTheme() {
        const saved = localStorage.getItem('theme');
        const icon = document.querySelector('#navTheme i');
        if (saved === 'night') {
            state.isDark = true;
            document.documentElement.setAttribute('data-theme', 'night');
            icon.className = 'fas fa-sun';
        } else {
            state.isDark = false;
            document.documentElement.setAttribute('data-theme', 'day');
            icon.className = 'fas fa-moon';
        }
    }

    // ============================================================
    // LOAD APPOINTMENT FROM STORAGE
    // ============================================================
    function loadAppointmentFromStorage() {
        const stored = localStorage.getItem('appointment');
        if (!stored) return null;

        try {
            const appt = JSON.parse(stored);
            const now = Date.now();
            const apptTime = new Date(`${appt.date}T${appt.time}:00`).getTime();
            if (apptTime > now) {
                state.appointment = appt;
                state.patientId = appt.patientId;
                return appt;
            } else {
                localStorage.removeItem('appointment');
                return null;
            }
        } catch (e) {
            localStorage.removeItem('appointment');
            return null;
        }
    }

    // ============================================================
    // PWA INSTALLATION
    // ============================================================
    let deferredPrompt;

    function setupInstall() {
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('navInstall').style.display = 'flex';
        });

        document.getElementById('navInstall').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    showToast('✅ تم تثبيت التطبيق بنجاح', 'success');
                    document.getElementById('navInstall').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            document.getElementById('navInstall').style.display = 'none';
        });
    }

    // ============================================================
    // AUTO REFRESH
    // ============================================================
    function startAutoRefresh() {
        setInterval(async () => {
            if (state.selectedDate) {
                console.log('🔄 تحديث المواعيد تلقائياً...');
                await loadSlotsForDay(state.selectedDay + 1);
            }
        }, 30000);
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
        console.log('🚀 بدء تهيئة التطبيق...');
            // تحميل الإعدادات أولاً
    const configLoaded = await loadConfig();
    if (!configLoaded) {
        showToast('فشل تحميل الإعدادات', 'error');
        return;
    }
    
    // تهيئة Supabase بعد تحميل الإعدادات
    if (!initSupabase()) {
        showToast('فشل تحميل Supabase', 'error');
        return;
    }
        // تهيئة Supabase
        if (!initSupabase()) {
            showToast('فشل تحميل Supabase', 'error');
            document.getElementById('slotsContainer').innerHTML = `
                <div style="text-align:center;padding:50px 0;color:var(--text-muted);">
                    <div style="font-size:16px;font-weight:600;">خطأ في التحميل</div>
                    <div style="font-size:14px;margin-top:4px;">فشل تحميل مكتبة Supabase</div>
                </div>
            `;
            return;
        }
        
        loadTheme();
        setupDaySelector();
        setupInstall();
        startAutoRefresh();

        const appt = loadAppointmentFromStorage();
        if (appt) {
            const booked = await fetchBookedSlots(appt.date);
            if (booked[appt.time]) {
                state.appointment = appt;
                showAppointmentScreen();
            } else {
                localStorage.removeItem('appointment');
                state.appointment = null;
            }
        }

        // Event Listeners
        document.getElementById('modalConfirmBtn').addEventListener('click', confirmBooking);
        document.getElementById('modalCancelBtn').addEventListener('click', closeBookingModal);

        document.getElementById('bookingModal').addEventListener('click', function(e) {
            if (e.target === this) closeBookingModal();
        });

        document.getElementById('whatsappInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') confirmBooking();
        });
        document.getElementById('patientNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('whatsappInput').focus();
        });

        document.getElementById('cancelAppointmentBtn').addEventListener('click', cancelAppointment);

        document.getElementById('navTheme').addEventListener('click', toggleTheme);
        document.getElementById('navNotifications').addEventListener('click', requestNotificationPermission);

        console.log('✅ التطبيق جاهز للعمل');
    }

    document.addEventListener('DOMContentLoaded', init);

    window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled error:', e.reason);
        showToast('حدث خطأ غير متوقع', 'error');
    });
